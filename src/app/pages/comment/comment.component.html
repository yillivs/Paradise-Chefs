<section class="intro">
  <p class="eyebrow">Testimonials</p>
  <h1>Kind words from our guests</h1>
</section>

<section class="featured">
  <div class="container" appReveal>
    <span class="mark" aria-hidden="true">&ldquo;</span>
    <blockquote>{{ featured.quote }}</blockquote>
    <p class="label">{{ featured.label }}</p>
  </div>
</section>

<section class="more">
  <div class="container">
    <div class="quote-grid">
      <div class="card-wrap" *ngFor="let t of testimonials; let i = index" appReveal="{{ i * 150 }}">
        <figure class="card-quote">
          <span class="mark" aria-hidden="true">&ldquo;</span>
          <blockquote>{{ t.quote }}</blockquote>
          <figcaption>{{ t.label }}</figcaption>
        </figure>
      </div>
    </div>
  </div>
</section>

<section class="cta">
  <div class="container" appReveal>
    <h2>Your event could be next</h2>
    <p>Tell us the occasion, the date and how many people, and we will take it from there.</p>
    <a class="btn btn-lg cta-button" href="mailto:costadezz@gmail.com">costadezz&#64;gmail.com</a>
  </div>
</section>
