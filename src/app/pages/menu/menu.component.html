<section class="menu-hero">
  <p class="eyebrow">Paradise Chefs Etc.</p>
  <h1>Our Menu</h1>
  <p class="menu-sub">Bespoke party foods for small and large gatherings.</p>
</section>

<div class="tabs-bar">
  <div class="tabs" role="tablist" aria-label="Menu categories">
    <button *ngFor="let category of categories; let i = index"
            type="button"
            role="tab"
            class="tab"
            [id]="'tab-' + category.id"
            [class.active]="category === selected"
            [attr.aria-selected]="category === selected"
            [attr.aria-controls]="'panel-' + category.id"
            [attr.tabindex]="category === selected ? 0 : -1"
            (click)="select(category)"
            (keydown)="onTabKey($event, i)">
      {{ category.name }}
    </button>
  </div>
</div>

<section class="menu-body container">
  <div class="row g-5">
    <div class="col-lg-6 order-lg-2">
      <figure class="photo-stack">
        <img *ngFor="let category of categories"
             [src]="category.photo"
             [alt]="category.photoAlt"
             [class.active]="category === selected">
        <figcaption>{{ selected.caption }}</figcaption>
      </figure>
    </div>

    <div class="col-lg-6 order-lg-1">
      <div *ngFor="let category of categories"
           class="panel"
           role="tabpanel"
           [id]="'panel-' + category.id"
           [attr.aria-labelledby]="'tab-' + category.id"
           [class.active]="category === selected">
        <h2>{{ category.name }}</h2>
        <ul>
          <li *ngFor="let dish of category.dishes; let i = index" [style.--i]="i">
            <span class="dish-name">{{ dish.name }}</span>
            <span *ngIf="dish.detail" class="dish-detail">{{ dish.detail }}</span>
          </li>
        </ul>
      </div>

      <p class="menu-note">
        Looking for something that is not listed? Tell us what you have in mind.
        <a href="mailto:costadezz@gmail.com">costadezz&#64;gmail.com</a>
      </p>
    </div>
  </div>
</section>

<section id="photos" class="photos">
  <div class="container">
    <h2 class="section-title" appReveal>From our kitchen</h2>
    <div class="photo-grid">
      <button *ngFor="let photo of photos; let i = index"
              type="button"
              class="photo-tile"
              appReveal
              [attr.aria-label]="'View photo: ' + photo.caption"
              (click)="open(i)">
        <img [src]="photo.src" [alt]="photo.alt" loading="lazy">
        <span class="photo-caption">{{ photo.caption }}</span>
      </button>
    </div>
  </div>
</section>

<div class="lightbox"
     *ngIf="lightboxIndex !== null"
     role="dialog"
     aria-modal="true"
     aria-label="Photo viewer"
     (click)="close()">
  <button type="button" class="lightbox-close" aria-label="Close" (click)="close()">&times;</button>
  <button type="button" class="lightbox-nav prev" aria-label="Previous photo"
          (click)="step(-1); $event.stopPropagation()">&#8249;</button>
  <figure (click)="$event.stopPropagation()">
    <img [src]="photos[lightboxIndex].src" [alt]="photos[lightboxIndex].alt">
    <figcaption>{{ photos[lightboxIndex].caption }}</figcaption>
  </figure>
  <button type="button" class="lightbox-nav next" aria-label="Next photo"
          (click)="step(1); $event.stopPropagation()">&#8250;</button>
</div>
